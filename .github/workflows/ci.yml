name: GenSticker CI Baseline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript Check
        run: npm run typecheck
      - name: ESLint Check
        run: npm run lint
      - name: Prettier Format Check
        run: npm run format:check

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install backend packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
      - name: Ruff Linting
        run: python -m ruff check backend
      - name: Mypy Type Check
        run: python -m mypy backend
      - name: Pytest Backend Suite
        run: python -m pytest backend/tests
      - name: Alembic Clean Migration Check
        run: |
          mkdir -p data/assets
          PYTHONPATH=. python -m alembic -c backend/alembic.ini upgrade head

  docker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: docker compose config
      - name: Build API Container Image
        run: docker build -t gensticker-api -f backend/Dockerfile .
