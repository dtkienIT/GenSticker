<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow-screen-flow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-screen-flow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker><marker id="arrow-screen-flow-frontend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B3DF5"/></marker><marker id="arrow-screen-flow-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DB2777"/></marker><marker id="arrow-screen-flow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="arrow-screen-flow-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/></marker><marker id="arrow-screen-flow-quality" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker><marker id="arrow-screen-flow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-screen-flow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="arrow-screen-flow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="112" rx="36" fill="#0F172A"/>
  <rect x="0" y="76" width="1600" height="36" fill="#0F172A"/>
  <circle cx="62" cy="55" r="22" fill="#5B3DF5"/>
  <text x="62" y="63" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="800">06</text>
  <text x="102" y="50" text-anchor="start" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">Screen flow của web app</text>
  <text x="103" y="82" text-anchor="start" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18" font-weight="500">Upload có preflight checking/verified; input reject tách khỏi output reject</text>
  <g filter="url(#shadow-screen-flow)"><g>
    <rect x="45" y="280" width="210" height="145" rx="24" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/>

    <text x="67" y="323" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="27" font-weight="800">Upload</text>
    <text x="67" y="361" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="67" dy="0">idle · file/style</tspan><tspan x="67" dy="29">chưa verified</tspan></text>
  </g><g>
    <rect x="315" y="280" width="245" height="145" rx="24" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>

    <text x="337" y="323" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="27" font-weight="800">Face checking</text>
    <text x="337" y="361" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="337" dy="0">Worker MediaPipe</tspan><tspan x="337" dy="29">upload/CTA khóa</tspan></text>
  </g><g>
    <rect x="315" y="525" width="245" height="145" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="337" y="568" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Input rejected</text>
    <text x="337" y="606" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="337" dy="0">0 / &gt;1 mặt</tspan><tspan x="337" dy="29">timeout / runtime error</tspan></text>
  </g><g>
    <rect x="625" y="145" width="225" height="140" rx="24" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/>

    <text x="647" y="188" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="27" font-weight="800">Auth modal</text>
    <text x="647" y="226" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="647" dy="0">guest login/register</tspan></text>
  </g><g>
    <rect x="625" y="420" width="225" height="140" rx="24" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/>

    <text x="647" y="463" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="27" font-weight="800">Processing</text>
    <text x="647" y="501" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="647" dy="0">5-step progress</tspan><tspan x="647" dy="29">raw previews</tspan></text>
  </g><g>
    <rect x="915" y="165" width="235" height="145" rx="24" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>

    <text x="937" y="208" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="27" font-weight="800">Gallery</text>
    <text x="937" y="246" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="937" dy="0">20 cards</tspan><tspan x="937" dy="29">download / favorite</tspan></text>
  </g><g>
    <rect x="915" y="470" width="235" height="155" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="937" y="513" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Output rejected</text>
    <text x="937" y="551" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="937" dy="0">raw comparison</tspan><tspan x="937" dy="29">reset → upload</tspan></text>
  </g><g>
    <rect x="1210" y="145" width="205" height="140" rx="24" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>

    <text x="1232" y="188" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="27" font-weight="800">History</text>
    <text x="1232" y="226" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="1232" dy="0">auth only</tspan><tspan x="1232" dy="29">soft delete</tspan></text>
  </g><g>
    <rect x="1210" y="420" width="205" height="140" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>

    <text x="1232" y="463" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="27" font-weight="800">Telegram</text>
    <text x="1232" y="501" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="1232" dy="0">deep link · QR</tspan></text>
  </g><g>
    <rect x="1430" y="280" width="140" height="145" rx="24" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/>

    <text x="1452" y="323" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="22" font-weight="800">Docs</text>
    <text x="1452" y="361" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="500"><tspan x="1452" dy="0">#tai-lieu</tspan><tspan x="1452" dy="25">12 files</tspan></text>
  </g><g><path d="M 255 350 L 315 350" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-screen-flow-quality)"/><rect x="230" y="316" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="285" y="338" text-anchor="middle" fill="#134E4A" font-family="Arial, sans-serif" font-size="16" font-weight="700">select</text></g><g><path d="M 560 315 L 625 215" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-screen-flow-frontend)"/><rect x="497.3" y="231" width="190.4" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="592.5" y="253" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="700">1 face + guest</text></g><g><path d="M 560 380 L 625 490" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-screen-flow-frontend)"/><rect x="504.1" y="401" width="176.79999999999998" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="592.5" y="423" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="700">1 face + auth</text></g><g><path d="M 435 425 L 435 525" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-screen-flow-risk)"/><rect x="367" y="441" width="136" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="435" y="463" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">0/&gt;1/error</text></g><g><path d="M 315 610 L 255 610 L 210 520 L 210 425" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-screen-flow-risk)"/><rect x="207.5" y="483.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="262.5" y="505.5" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">reselect</text></g><g><path d="M 850 490 L 880 490 L 880 238 L 915 238" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-screen-flow-data)"/><rect x="827.5" y="330" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="882.5" y="352" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="16" font-weight="700">success</text></g><g><path d="M 850 520 L 915 548" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-screen-flow-risk)"/><rect x="827.5" y="500" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="882.5" y="522" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">failure</text></g><g><path d="M 1150 220 L 1210 215" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-screen-flow-data)"/><rect x="1125" y="183.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1180" y="205.5" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="16" font-weight="700">open</text></g><g><path d="M 1150 255 L 1210 490" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#arrow-screen-flow-external)"/><rect x="1125" y="338.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1180" y="360.5" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="16" font-weight="700">export</text></g><g><path d="M 915 580 L 700 720 L 400 690 L 255 405" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-screen-flow-risk)"/><rect x="555" y="683" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="610" y="705" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">Thử Lại</text></g><g><path d="M 1415 215 L 1430 335" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-screen-flow-frontend)"/><rect x="1367.5" y="241" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1422.5" y="263" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="700">header</text></g></g>
