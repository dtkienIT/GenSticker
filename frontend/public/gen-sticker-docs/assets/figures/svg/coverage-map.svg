  <text x="102" y="50" text-anchor="start" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">Bản đồ coverage hiện tại</text>
  <text x="103" y="82" text-anchor="start" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18" font-weight="500">75 backend tests + manual face-gate proof; automated frontend coverage vẫn là gap</text>
