    <text x="722" y="296" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="722" dy="0">Bearer · MIME · owner</tspan><tspan x="722" dy="29">cache · missing key</tspan></text>
  </g><g>
    <rect x="80" y="385" width="280" height="135" rx="24" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/>

