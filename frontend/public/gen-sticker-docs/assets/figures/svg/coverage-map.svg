    <text x="102" y="258" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="21" font-weight="800">Grouped · 18</text>
    <text x="102" y="296" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="102" dy="0">4 calls · 4×2 split</tspan><tspan x="102" dy="29">reject · resume</tspan></text>
