  <text x="102" y="50" text-anchor="start" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">Vòng đời dữ liệu và điểm giữ lại</text>
  <text x="103" y="82" text-anchor="start" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18" font-weight="500">Luồng as-is của selfie, artifact tạm, output và soft delete</text>
  <g filter="url(#shadow-data-lifecycle)"><g><rect x="60" y="245" width="245" height="120" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/><circle cx="102" cy="283" r="24" fill="#0891B2"/><text x="102" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">1</text><text x="138" y="288" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="23" font-weight="800">Upload</text><text x="84" y="326" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="84" dy="0">selfie → Storage</tspan><tspan x="84" dy="23">public URL logged</tspan></text></g><g><path d="M 305 305 L 365 305" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-data-lifecycle-risk)"/></g><g><rect x="365" y="245" width="245" height="120" rx="22" fill="#FDF2F8" stroke="#DB2777" stroke-width="3"/><circle cx="407" cy="283" r="24" fill="#DB2777"/><text x="407" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">2</text><text x="443" y="288" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="23" font-weight="800">Generate</text><text x="389" y="326" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="389" dy="0">RAM job + temp dir</tspan><tspan x="389" dy="23">provider receives refs</tspan></text></g><g><path d="M 610 305 L 670 305" fill="none" stroke="#DB2777" stroke-width="4" marker-end="url(#arrow-data-lifecycle-backend)"/></g><g><rect x="670" y="245" width="245" height="120" rx="22" fill="#ECFDF5" stroke="#059669" stroke-width="3"/><circle cx="712" cy="283" r="24" fill="#059669"/><text x="712" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">3</text><text x="748" y="288" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="23" font-weight="800">Persist</text><text x="694" y="326" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="694" dy="0">20 outputs upload</tspan><tspan x="694" dy="23">pack then stickers</tspan></text></g><g><path d="M 915 305 L 975 305" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-data-lifecycle-data)"/></g><g><rect x="975" y="245" width="245" height="120" rx="22" fill="#ECFDF5" stroke="#059669" stroke-width="3"/><circle cx="1017" cy="283" r="24" fill="#059669"/><text x="1017" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">4</text><text x="1053" y="288" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="23" font-weight="800">History</text><text x="999" y="326" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="999" dy="0">owner filter</tspan><tspan x="999" dy="23">active packs only</tspan></text></g><g><path d="M 1220 305 L 1280 305" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-data-lifecycle-risk)"/></g><g><rect x="1280" y="245" width="260" height="120" rx="22" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/><circle cx="1322" cy="283" r="24" fill="#DC2626"/><text x="1322" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">5</text><text x="1358" y="288" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="23" font-weight="800">Soft delete</text><text x="1304" y="326" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1304" dy="0">is_deleted + deleted_at</tspan><tspan x="1304" dy="23">objects remain</tspan></text></g><g>
    <rect x="90" y="485" width="410" height="165" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="112" y="528" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Selfie source</text>
    <text x="112" y="566" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="112" dy="0">Upload xảy ra trước rate/capacity checks.</tspan><tspan x="112" dy="26">Không có DB row liên kết; chưa thấy</tspan><tspan x="112" dy="26">retention cleanup cho selfie.</tspan></text>
  </g><g>
