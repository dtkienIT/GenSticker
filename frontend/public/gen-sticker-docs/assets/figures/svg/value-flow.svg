  <g filter="url(#shadow-value-flow)"><g><rect x="45" y="142" width="1510" height="610" rx="26" fill="#EEF2FF" fill-opacity="0.55" stroke="#5B3DF5" stroke-width="2" /><text x="69" y="179" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="21" font-weight="800">Phạm vi MVP đang chạy</text></g><g><rect x="85" y="235" width="245" height="120" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/><circle cx="127" cy="273" r="24" fill="#0891B2"/><text x="127" y="281" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">1</text><text x="163" y="278" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="23" font-weight="800">Upload</text><text x="109" y="316" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="109" dy="0">JPEG · PNG · WebP</tspan><tspan x="109" dy="23">≤15 MiB · ≤40 MP</tspan></text></g><g><path d="M 330 295 L 390 295" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-value-flow-frontend)"/></g><g><rect x="390" y="235" width="245" height="120" rx="22" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/><circle cx="432" cy="273" r="24" fill="#5B3DF5"/><text x="432" y="281" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">2</text><text x="468" y="278" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="23" font-weight="800">Giữ danh tính</text><text x="414" y="316" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="414" dy="0">Selfie → canonical</tspan><tspan x="414" dy="23">1 image edit call</tspan></text></g><g><path d="M 635 295 L 695 295" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-value-flow-frontend)"/></g><g><rect x="695" y="235" width="245" height="120" rx="22" fill="#FDF2F8" stroke="#DB2777" stroke-width="3"/><circl