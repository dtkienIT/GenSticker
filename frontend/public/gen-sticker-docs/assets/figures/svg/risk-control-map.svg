    <text x="107" y="546" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="500"><tspan x="107" dy="0">remove tracked user/base64</tspan><tspan x="107" dy="25">data from Git</tspan><tspan x="107" dy="25">remove/rotate demo credential</tspan><tspan x="107" dy="25">bound/auth Telegram export</tspan></text>
