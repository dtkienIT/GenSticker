    <text x="107" y="301" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="107" dy="0">selfie · JWT localStorage</tspan><tspan x="107" dy="26">base64 sticker export</tspan></text>
