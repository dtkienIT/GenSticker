rcle cx="617" cy="243" r="24" fill="#0D9488"/><text x="617" y="251" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">3</text><text x="653" y="248" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="23" font-weight="800">MediaPipe</text><text x="599" y="286" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="599" dy="0">BlazeFace · CPU/WASM</tspan><tspan x="599" dy="23">conf 0.6 · suppr 0.3</tspan></text></g><g><path d="M 825 265 L 855 265" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-validation-boundaries-quality)"/></g><g>
