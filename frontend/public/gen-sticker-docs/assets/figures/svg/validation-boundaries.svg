    <marker id="arrow-validation-boundaries-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker><marker id="arrow-validation-boundaries-frontend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B3DF5"/></marker><marker id="arrow-validation-boundaries-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DB2777"/></marker><marker id="arrow-validation-boundaries-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="arrow-validation-boundaries-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/></marker><marker id="arrow-validation-boundaries-quality" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker><marker id="arrow-validation-boundaries-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-validation-boundaries-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="arrow-validation-boundaries-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="112" rx="36" fill="#0F172A"/>
  <rect x="0" y="76" width="1600" height="36" fill="#0F172A"/>
  <circle cx="62" cy="55" r="22" fill="#5B3DF5"/>
  <text x="62" y="63" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="800">09</text>
  <text x="102" y="50" text-anchor="start" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">Validation theo từng trust boundary</text>
  <text x="103" y="82" text-anchor="start" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18" font-weight="500">Mỗi lớp chặn một loại input khác nhau trước khi ảnh tới provider</text>
  <g filter="url(#shadow-validation-boundaries)"><g><rect x="45" y="155" width="1510" height="585" rx="26" fill="#F0FDFA" fill-opacity="0.55" stroke="#0D9488" stroke-width="2" /><text x="69" y="192" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="21" font-weight="800">Defense in depth</text></g><g><rect x="75" y="230" width="260" height="120" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/><circle cx="117" cy="268" r="24" fill="#0891B2"/><text x="117" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">1</text><text x="153" y="273" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="23" font-weight="800">Browser</text><text x="99" y="311" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="99" dy="0">MIME allow-list</tspan><tspan x="99" dy="23">≤15 MiB · preview</tspan></text></g><g><path d="M 335 290 L 390 290" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-validation-boundaries-frontend)"/></g><g><rect x="390" y="230" width="260" height="120" rx="22" fill="#FDF2F8" stroke="#DB2777" stroke-width="3"/><circle cx="432" cy="268" r="24" fill="#DB2777"/><text x="432" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">2</text><text x="468" y="273" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="23" font-weight="800">FastAPI</text><text x="414" y="311" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="414" dy="0">Bearer · bytes · format</tspan><tspan x="414" dy="23">≤40 MP · style_id</tspan></text></g><g><path d="M 650 290 L 705 290" fill="none" stroke="#DB2777" stroke-width="4" marker-end="url(#arrow-validation-boundaries-backend)"/></g><g><rect x="705" y="230" width="260" height="120" rx="22" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/><circle cx="747" cy="268" r="24" fill="#0D9488"/><text x="747" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">3</text><text x="783" y="273" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="23" font-weight="800">Sanitize</text><text x="729" y="311" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="729" dy="0">EXIF transpose</tspan><tspan x="729" dy="23">strip metadata · RGB</tspan></text></g><g><path d="M 965 290 L 1020 290" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-validation-boundaries-quality)"/></g><g><rect x="1020" y="230" width="260" height="120" rx="22" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/><circle cx="1062" cy="268" r="24" fill="#EA580C"/><text x="1062" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">4</text><text x="1098" y="273" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20" font-weight="800">Provider guard</text><text x="1044" y="311" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1044" dy="0">≤10 MiB/reference</tspan><tspan x="1044" dy="23">≤30 MiB total</tspan></text></g><g><path d="M 1280 290 L 1335 290" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#arrow-validation-boundaries-external)"/></g><g><rect x="1335" y="230" width="185" height="120" rx="22" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/><circle cx="1377" cy="268" r="24" fill="#0D9488"/><text x="1377" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">5</text><text x="1413" y="273" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="23" font-weight="800">Decode</text><text x="1359" y="311" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1359" dy="0">b64 PNG</tspan><tspan x="1359" dy="23">≤20 MiB</tspan></text></g><g>
    <rect x="110" y="465" width="390" height="170" rx="24" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>

    <text x="132" y="508" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="27" font-weight="800">Safe rejection</text>
    <text x="132" y="546" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="18" font-weight="500"><tspan x="132" dy="0">400/401/403/402/429 được map</tspan><tspan x="132" dy="27">sang message không lộ raw provider error.</tspan></text>
  </g><g>
    <rect x="605" y="465" width="390" height="170" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="627" y="508" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Current gaps</text>
    <text x="627" y="546" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="18" font-weight="500"><tspan x="627" dy="0">Không có malware/NSFW policy local</tspan><tspan x="627" dy="27">không có frontend test</tspan><tspan x="627" dy="27">decompression fuzz còn thiếu</tspan></text>
  </g><g>
    <rect x="1100" y="465" width="390" height="170" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>

    <text x="1122" y="508" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="27" font-weight="800">Privacy boundary</text>
    <text x="1122" y="546" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="18" font-weight="500"><tspan x="1122" dy="0">Selfie sanitized vẫn là dữ liệu chân dung</tspan><tspan x="1122" dy="27">và được gửi sang API ảnh bên thứ ba.</tspan></text>
  </g></g>
