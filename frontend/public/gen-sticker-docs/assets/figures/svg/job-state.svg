10 8"/><rect x="994.4" y="368" width="231.2" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1110" y="390" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="16" font-weight="700">resume processing</text></g></g>
