  <g filter="url(#shadow-pipeline-five-stage)"><g><rect x="60" y="245" width="270" height="120" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/><circle cx="102" cy="283" r="24" fill="#0891B2"/><text x="102" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">01</text><text x="138" y="288" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="23" font-weight="800">Normalize</text><text x="84" y="326" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="84" dy="0">EXIF transpose · strip metadata</tspan><tspan x="84" dy="23">RGB · max side 1536</tspan></text></g><g><path d="M 330 305 L 370 305" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-pipeline-five-stage-frontend)"/></g><g><rect x="370" y="245" width="270" height="120" rx="22" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/><circle cx="412" cy="283" r="24" fill="#5B3DF5"/><text x="412" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">02</text><text x="448" y="288" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="23" font-weight="800">Canonical</text><text x="394" y="326" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="394" dy="0">Khoá identity/style</tspan><tspan x="394" dy="23">1 selfie reference</tspan></text></g><g><path d="M 640 305 L 680 305" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-pipeline-five-stage-frontend)"/></g><g><rect x="680" y="245" width="270" height="120" rx="22" fill="#FDF2F8" stroke="#DB2777" stroke-width="3"/><circle cx="722" cy="283" r="24" fill="#DB2777"/><text x="722" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">03</text><text x="758" y="288" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="23" font-weight="800">Three sheets</text><text x="704" y="326" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="704" dy="0">strict 4×2</tspan><tspan x="704" dy="23">8 + 8 + 4 keep</tspan></text></g><g><path d="M 950 305 L 990 305" fill="none" stroke="#DB2777" stroke-width="4" marker-end="url(#arrow-pipeline-five-stage-backend)"/></g><g><rect x="990" y="245" width="270" height="120" rx="22" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/><circle cx="1032" cy="283" r="24" fill="#0D9488"/><text x="1032" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">04</text><text x="1068" y="288" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="23" font-weight="800">Structural QA</text><text x="1014" y="326" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1014" dy="0">adaptive gutters</tspan><tspan x="1014" dy="23">cut score · occupancy</tspan></text></g><g><path d="M 1260 305 L 1300 305" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-pipeline-five-stage-quality)"/></g><g><rect x="1300" y="245" width="240" height="120" rx="22" fill="#ECFDF5" stroke="#059669" stroke-width="3"/><circle cx="1342" cy="283" r="24" fill="#059669"/><text x="1342" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">05</text><text x="1378" y="288" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="23" font-weight="800">Postprocess</text><text x="1324" y="326" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1324" dy="0">crop · outline</tspan><tspan x="1324" dy="23">20 × 512 PNG</tspan></text></g><g>
