  <g filter="url(#shadow-quality-gates)"><g><rect x="55" y="250" width="245" height="120" rx="22" fill="#FDF2F8" stroke="#DB2777" stroke-width="3"/><circle cx="97" cy="288" r="24" fill="#DB2777"/><text x="97" y="296" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">1</text><text x="133" y="293" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="23" font-weight="800">Backend</text><text x="79" y="331" text-anchor="start" fill="#831843" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="79" dy="0">pytest 75 cases</tspan><tspan x="79" dy="23">mock paid providers</tspan></text></g><g><path d="M 300 310 L 360 310" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-gates-quality)"/></g><g><rect x="360" y="250" width="245" height="120" rx="22" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/><circle cx="402" cy="288" r="24" fill="#5B3DF5"/><text x="402" y="296" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">2</text><text x="438" y="293" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="23" font-weight="800">Frontend</text><text x="384" y="331" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="384" dy="0">ESLint</tspan><tspan x="384" dy="23">production build</tspan></text></g><g><path d="M 605 310 L 665 310" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-gates-quality)"/></g><g><rect x="665" y="250" width="245" height="120" rx="22" fill="#F8FAFC" stroke="#64748B" stroke-width="3"/><circle cx="707" cy="288" r="24" fill="#64748B"/><text x="707" y="296" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">3</text><text x="743" y="293" text-anchor="start" fill="#0F172A" font-family="Arial, sans-serif" font-size="23" font-weight="800">Docs build</text><text x="689" y="331" text-anchor="start" fill="#0F172A" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="689" dy="0">5 DOCX + 6 XLSX</tspan><tspan x="689" dy="23">manifest/assets sync</tspan></text></g><g><path d="M 910 310 L 970 310" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-gates-quality)"/></g><g><rect x="970" y="250" width="245" height="120" rx="22" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/><circle cx="1012" cy="288" r="24" fill="#0D9488"/><text x="1012" y="296" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">4</text><text x="1048" y="293" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="23" font-weight="800">Visual QA</text><text x="994" y="331" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="994" dy="0">render every page</tspan><tspan x="994" dy="23">render every sheet</tspan></text></g><g><path d="M 1215 310 L 1275 310" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-gates-quality)"/></g><g><rect x="1275" y="250" width="265" height="120" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/><circle cx="1317" cy="288" r="24" fill="#0891B2"/><text x="1317" y="296" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">5</text><text x="1353" y="293" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="23" font-weight="800">Browser QA</text><text x="1299" y="331" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1299" dy="0">desktop + mobile</tspan><tspan x="1299" dy="23">keyboard + download</tspan></text></g><g>
    <rect x="135" y="475" width="370" height="175" rx="24" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>

