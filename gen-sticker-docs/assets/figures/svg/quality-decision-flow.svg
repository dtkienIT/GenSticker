<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow-quality-decision-flow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-quality-decision-flow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker><marker id="arrow-quality-decision-flow-frontend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B3DF5"/></marker><marker id="arrow-quality-decision-flow-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DB2777"/></marker><marker id="arrow-quality-decision-flow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="arrow-quality-decision-flow-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/></marker><marker id="arrow-quality-decision-flow-quality" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker><marker id="arrow-quality-decision-flow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-quality-decision-flow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="arrow-quality-decision-flow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="112" rx="36" fill="#0F172A"/>
  <rect x="0" y="76" width="1600" height="36" fill="#0F172A"/>
  <circle cx="62" cy="55" r="22" fill="#5B3DF5"/>
  <text x="62" y="63" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="800">10</text>
  <text x="102" y="50" text-anchor="start" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">Decision flow của grid quality gate</text>
  <text x="103" y="82" text-anchor="start" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18" font-weight="500">Ngưỡng đang dùng trong GroupedStickerGenerator; pass mới được crop/postprocess</text>
  <g filter="url(#shadow-quality-decision-flow)"><g>
    <rect x="65" y="250" width="220" height="130" rx="24" fill="#F8FAFC" stroke="#64748B" stroke-width="3"/>

    <text x="87" y="293" text-anchor="start" fill="#0F172A" font-family="Arial, sans-serif" font-size="27" font-weight="800">Decode RGBA</text>
    <text x="87" y="331" text-anchor="start" fill="#0F172A" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="87" dy="0">raw sheet</tspan></text>
  </g><g><path d="M 285 315 L 350 315" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-decision-flow-quality)"/></g><g>
    <rect x="350" y="235" width="260" height="160" rx="24" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>

    <text x="372" y="278" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="27" font-weight="800">Dimensions</text>
    <text x="372" y="316" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="372" dy="0">width ≥1000</tspan><tspan x="372" dy="29">height ≥600</tspan></text>
  </g><g><path d="M 610 315 L 675 315" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-decision-flow-quality)"/><rect x="587.5" y="281" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="642.5" y="303" text-anchor="middle" fill="#134E4A" font-family="Arial, sans-serif" font-size="16" font-weight="700">pass</text></g><g>
    <rect x="675" y="215" width="280" height="200" rx="24" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>

    <text x="697" y="258" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="27" font-weight="800">Foreground mask</text>
    <text x="697" y="296" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="697" dy="0">alpha ratio &gt;5%?</tspan><tspan x="697" dy="29">transparent: alpha&gt;16</tspan><tspan x="697" dy="29">opaque: local contrast</tspan></text>
  </g><g><path d="M 955 315 L 1020 315" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-decision-flow-quality)"/></g><g>
    <rect x="1020" y="200" width="280" height="230" rx="24" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/>

    <text x="1042" y="243" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="27" font-weight="800">Adaptive 4×2</text>
    <text x="1042" y="281" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="1042" dy="0">gutter search ≈4%</tspan><tspan x="1042" dy="29">cut_score</tspan><tspan x="1042" dy="29">minimum_occupancy</tspan><tspan x="1042" dy="29">dominant crossing</tspan></text>
  </g><g><path d="M 1300 315 L 1360 315" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-quality-decision-flow-quality)"/><rect x="1275" y="281" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1330" y="303" text-anchor="middle" fill="#134E4A" font-family="Arial, sans-serif" font-size="16" font-weight="700">pass</text></g><g>
    <rect x="1360" y="235" width="180" height="160" rx="24" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>

    <text x="1382" y="278" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="23" font-weight="800">Crop 8</text>
    <text x="1382" y="316" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="18" font-weight="500"><tspan x="1382" dy="0">postprocess</tspan><tspan x="1382" dy="27">512px</tspan></text>
  </g><g>
    <rect x="300" y="525" width="310" height="165" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="322" y="568" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Reject: size</text>
    <text x="322" y="606" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="322" dy="0">pack_sheet_too_small</tspan></text>
  </g><g>
    <rect x="675" y="515" width="350" height="190" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="697" y="558" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Reject: transparent</text>
    <text x="697" y="596" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="697" dy="0">cut ≥0.45</tspan><tspan x="697" dy="29">hoặc cut &gt;0.10 + crossing</tspan><tspan x="697" dy="29">occupancy &lt;0.03</tspan></text>
  </g><g>
    <rect x="1080" y="525" width="315" height="165" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="1102" y="568" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Reject: opaque</text>
    <text x="1102" y="606" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="1102" dy="0">cut &gt;0.18</tspan><tspan x="1102" dy="29">hoặc occupancy &lt;0.03</tspan></text>
  </g><g><path d="M 480 395 L 455 525" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-quality-decision-flow-risk)"/><rect x="412.5" y="426" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="467.5" y="448" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">fail</text></g><g><path d="M 875 415 L 850 515" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-quality-decision-flow-risk)"/><rect x="807.5" y="431" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="862.5" y="453" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">fail</text></g><g><path d="M 1160 430 L 1235 525" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-quality-decision-flow-risk)"/><rect x="1142.5" y="443.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1197.5" y="465.5" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">fail</text></g><text x="800" y="756" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="19" font-weight="800">Structural gate only — chưa tự chấm likeness, anatomy, OCR/watermark hoặc semantic pose</text></g>
  <g><rect x="60" y="822" width="28" height="28" rx="8" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="2" /><text x="100" y="843" text-anchor="start" fill="#475569" font-family="Arial, sans-serif" font-size="17" font-weight="600">Đã triển khai</text><rect x="265" y="822" width="28" height="28" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2" /><text x="305" y="843" text-anchor="start" fill="#475569" font-family="Arial, sans-serif" font-size="17" font-weight="600">Suy ra từ source</text><rect x="503" y="822" width="28" height="28" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" /><text x="543" y="843" text-anchor="start" fill="#475569" font-family="Arial, sans-serif" font-size="17" font-weight="600">Gap / rủi ro</text><rect x="697" y="822" width="28" height="28" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" /><text x="737" y="843" text-anchor="start" fill="#475569" font-family="Arial, sans-serif" font-size="17" font-weight="600">Khuyến nghị</text></g>
</svg>
