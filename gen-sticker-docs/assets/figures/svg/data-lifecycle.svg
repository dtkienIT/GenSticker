  <g filter="url(#shadow-data-lifecycle)"><g><rect x="55" y="235" width="220" height="120" rx="22" fill="#F0FDFA" stroke="#0D9488" stroke-width="3"/><circle cx="97" cy="273" r="24" fill="#0D9488"/><text x="97" y="281" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">0</text><text x="133" y="278" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="23" font-weight="800">Local gate</text><text x="79" y="316" text-anchor="start" fill="#134E4A" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="79" dy="0">File → ImageBitmap</tspan><tspan x="79" dy="23">MediaPipe CPU/WASM</tspan></text></g><g><path d="M 275 295 L 305 295" fill="none" stroke="#0D9488" stroke-width="4" marker-end="url(#arrow-data-lifecycle-quality)"/><rect x="235" y="261" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="290" y="283" text-anchor="middle" fill="#134E4A" font-family="Arial, sans-serif" font-size="16" font-weight="700">1 face</text></g><g><rect x="305" y="235" width="220" height="120" rx="22" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/><circle cx="347" cy="273" r="24" fill="#0891B2"/><text x="347" y="281" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="800">1</text><text x="383" y="278" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="23" font-weight="800">Upload</text><text x="329" y="316" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="17" font-weight="500"><tspan x="329" dy="0">selfie → Storage</tspan><tspan x="329" dy="23">khi user Generate</tspan></text></g><g><path d="M 525 295 L 555 295" fill="none" stroke="#DB2777" stroke-width="4" marker-end="url(#arrow-data-lifecycle-backend)"/></g><g><rect x="555" y="235" width="220" height="120" rx="22" fill="#FDF2F8" stroke="#DB2777" stroke-width="3"/><circle cx="597" cy="273" r="24" fill="#DB2777"/><text x="597" y