<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow-screen-flow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-screen-flow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker><marker id="arrow-screen-flow-frontend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B3DF5"/></marker><marker id="arrow-screen-flow-backend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DB2777"/></marker><marker id="arrow-screen-flow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="arrow-screen-flow-external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/></marker><marker id="arrow-screen-flow-quality" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/></marker><marker id="arrow-screen-flow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arrow-screen-flow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><marker id="arrow-screen-flow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="112" rx="36" fill="#0F172A"/>
  <rect x="0" y="76" width="1600" height="36" fill="#0F172A"/>
  <circle cx="62" cy="55" r="22" fill="#5B3DF5"/>
  <text x="62" y="63" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="800">06</text>
  <text x="102" y="50" text-anchor="start" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="800">Screen flow của web app</text>
  <text x="103" y="82" text-anchor="start" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18" font-weight="500">Các view, overlay và state chuyển đổi thực tế trong frontend</text>
  <g filter="url(#shadow-screen-flow)"><g>
    <rect x="60" y="280" width="235" height="150" rx="24" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/>

    <text x="82" y="323" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="27" font-weight="800">Upload</text>
    <text x="82" y="361" text-anchor="start" fill="#164E63" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="82" dy="0">file preview</tspan><tspan x="82" dy="29">style picker</tspan></text>
  </g><g>
    <rect x="365" y="155" width="235" height="145" rx="24" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/>

    <text x="387" y="198" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="27" font-weight="800">Auth modal</text>
    <text x="387" y="236" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="387" dy="0">login · register</tspan><tspan x="387" dy="29">demo dev-only</tspan></text>
  </g><g>
    <rect x="365" y="430" width="235" height="145" rx="24" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/>

    <text x="387" y="473" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="27" font-weight="800">Processing</text>
