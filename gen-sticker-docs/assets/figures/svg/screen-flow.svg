    <text x="1062" y="236" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="1062" dy="0">authenticated only</tspan><tspan x="1062" dy="29">soft delete</tspan></text>
  </g><g>
    <rect x="1040" y="430" width="235" height="145" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>

    <text x="1062" y="473" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="27" font-weight="800">Telegram modal</text>
    <text x="1062" y="511" text-anchor="start" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="1062" dy="0">deep link · QR</tspan><tspan x="1062" dy="29">export progress</tspan></text>
  </g><g>
    <rect x="1350" y="280" width="190" height="150" rx="24" fill="#EEF2FF" stroke="#5B3DF5" stroke-width="3"/>

    <text x="1372" y="323" text-anchor="start" fill="#312E81" font-family="Arial, sans-serif" font-size="27" font-weight="800">Docs hub</text>
