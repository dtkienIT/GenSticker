    <text x="712" y="261" text-anchor="start" fill="#065F46" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="712" dy="0">20 cards</tspan><tspan x="712" dy="29">download / favorite</tspan></text>
  </g><g>
    <rect x="690" y="465" width="250" height="150" rx="24" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/>

    <text x="712" y="508" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="27" font-weight="800">Rejected</text>
    <text x="712" y="546" text-anchor="start" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="20" font-weight="500"><tspan x="712" dy="0">comparison preview</tspan><tspan x="712" dy="29">reset → upload</tspan></text>
  </g><g>
    <rect x="1040" y="155" width="235" height="145" rx="24" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>

