  </g><g><path d="M 295 325 L 365 230" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-screen-flow-frontend)"/><rect x="275" y="243.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="330" y="265.5" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="700">guest</text></g><g><path d="M 295 355 L 365 500" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-screen-flow-frontend)"/><rect x="275" y="393.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="330" y="415.5" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="700">generate</text></g><g><path d="M 600 500 L 640 500 L 640 255 L 690 255" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-screen-flow-data)"/><rect x="590" y="343.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="645" y="365.5" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="16" font-weight="700">success</text></g><g><path d="M 600 520 L 690 540" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-screen-flow-risk)"/><rect x="590" y="496" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="645" y="518" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">failure</text></g><g><path d="M 940 240 L 1040 225" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-screen-flow-data)"/><rect x="935" y="198.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="990" y="220.5" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-size="16" font-weight="700">open</text></g><g><path d="M 940 270 L 1040 500" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#arrow-screen-flow-external)"/><rect x="935" y="351" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="990" y="373" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="16" font-weight="700">export</text></g><g><path d="M 690 580 L 565 700 L 290 610 L 295 400" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-screen-flow-risk)"/><rect x="423.4" y="668" width="163.2" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="505" y="690" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16" font-weight="700">Thử Lại Ngay</text></g><g><path d="M 1275 230 L 1350 335" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-screen-flow-frontend)"/><rect x="1257.5" y="248.5" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1312.5" y="270.5" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="700">header</text></g><g><path d="M 1350 380 L 1275 500" fill="none" stroke="#5B3DF5" stroke-width="4" marker-end="url(#arrow-screen-flow-frontend)"/><rect x="1257.5" y="406" width="110" height="32" rx="16" fill="#FFFFFF" opacity="0.96"/><text x="1312.5" y="428" text-anchor="middle" fill="#312E81" font-family="Arial, sans-serif" font-size="16" font-weight="700">back</text></g></g>
